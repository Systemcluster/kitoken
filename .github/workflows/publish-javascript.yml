name: Publish JavaScript

on:
  workflow_run:
    branches:
      - main
    workflows:
      - Tests & Checks
    types:
      - completed
  workflow_dispatch:

permissions: write-all

jobs:

  publish:

    name: Publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main' && github.repository_owner == 'Systemcluster')}}

    strategy:
      matrix:
        os:
          - ubuntu-latest
        toolchain:
          - stable

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          show-progress: false

      - name: Set up Rust
        uses: Systemcluster/actions@setup-rust-v0
        with:
          channel: ${{ matrix.toolchain }}
          components: |
            rust-src
          cache-key-job: true
          binaries: |
            wasm-bindgen-cli
            wasm-opt

      - name: Set up Node.js
        uses: Systemcluster/actions@setup-node-v0
        with:
          cache: true
          node-version: lts
          package-manager: pnpm
          directory: packages/javascript

      - name: Build
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cd packages/javascript
          pnpm install --ignore-scripts
          pnpm prepare

      - name: Publish (dry-run)
        id: publish-dry-run
        env:
          NPM_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
        if: env.NPM_TOKEN == ''
        run: |
          cd packages/javascript
          rm -f dist/.gitignore
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
          echo "always-auth=true" >> .npmrc
          npm publish --ignore-scripts --access public --provenance --dry-run

      - name: Publish
        id: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
        if: env.NPM_TOKEN != ''
        run: |
          cd packages/javascript
          rm -f dist/.gitignore
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          echo "always-auth=true" >> .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
          npm publish --ignore-scripts --access public --provenance

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: javascript
          path: packages/javascript
